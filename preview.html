import { supabase } from '../lib/supabaseClient';

export class ProjectIntelligenceEngine {

      content: query
    });

      query_embedding: embedding.values,
      match_threshold: matchThreshold,
      match_count: 5
    });

    if (error) throw new Error(\`RAG Retrieval error: \${error.message}\`);
    return chunks;
  }
}`

  const { email, password } = req.body;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) return res.status(401).json({ error: error.message });

  return res.status(200).json({
    message: "Developer authenticated successfully.",
    user: data.user,
    token: data.session.access_token
  });
}`

                      <button
                        onClick={() => setActiveDevTab('code')}
                        className={`px-4 py-2 ${activeDevTab === 'code' ? 'bg-[#D5FF00] text-[#0A0A0A] font-bold' : 'bg-[#141414] text-[#888888]'}`}
                      >
                        Source Code
                      </button>
                      <button
                        onClick={() => setActiveDevTab('api')}
                        className={`px-4 py-2 ${activeDevTab === 'api' ? 'bg-[#D5FF00] text-[#0A0A0A] font-bold' : 'bg-[#141414] text-[#888888]'}`}
                      >
                        In-App API Tester
                      </button>
                    </div>
                  </div>

                  {activeDevTab === 'code' ? (
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                      <div className="card-dark p-5">
                        <span className="font-display text-lg uppercase text-[#F4F3ED] block mb-3">Repository Files</span>
                        {projectFiles.map((f, i) => (
                          <button
                            key={i}
                            onClick={() => setSelectedFile(f)}
                            className={`w-full text-left p-3 font-mono text-xs mb-1.5 transition-colors ${selectedFile.name === f.name ? 'bg-[#D5FF00] text-[#0A0A0A] font-bold' : 'text-[#888888] hover:bg-[#161616]'}`}
                          >
                            {f.name}
                          </button>
                        ))}
                      </div>

                      <div className="lg:col-span-3 card-dark p-6">
                        <div className="flex justify-between font-mono text-xs border-b border-[#222222] pb-3 mb-4">
                          <span className="text-[#D5FF00] font-bold">{selectedFile.path}</span>
                          <span className="text-[#777777]">{selectedFile.lines} Lines</span>
                        </div>
                        <pre className="bg-[#070707] p-5 font-mono text-xs text-[#CCCCCC] overflow-x-auto max-h-[460px] leading-relaxed">
                          {selectedFile.content}
                        </pre>
                      </div>
                    </div>
                  ) : (
                    <div className="card-dark p-8 space-y-6">
                      <div className="flex gap-2 font-mono text-xs">
                        <span className="px-3 py-2 bg-[#1A1A1A] text-[#D5FF00] font-bold">{selectedEp.method}</span>
                        <input
                          type="text"
                          readOnly
                          value={`http://localhost:5000${selectedEp.path}`}
                          className="flex-1 bg-[#0A0A0A] border border-[#222222] px-4 text-[#F4F3ED]"
                        />
                        <button
                          onClick={handleSendApi}
                          className="neon-btn px-6 py-2 uppercase font-grotesk"
                        >
                          {apiLoading ? 'Testing...' : 'Send Request'}
                        </button>
                      </div>

                      <div className="pt-6 border-t border-[#222222]">
                        <div className="flex justify-between font-mono text-xs text-[#777777] mb-2">
                          <span>Status: <b className="text-[#D5FF00]">{apiResult.status} {apiResult.statusText}</b></span>
                          <span>Latency: <b className="text-[#D5FF00]">{apiResult.time}</b></span>
                        </div>
                        <pre className="p-4 bg-[#070707] border border-[#222222] font-mono text-xs text-[#D5FF00]/90 overflow-x-auto">
                          {JSON.stringify(apiResult.body, null, 2)}
                        </pre>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Creative Workspace */}
              {activeWorkspace === 'creative' && (
                <div className="space-y-8">
                  <div className="card-dark p-8">
                    <span className="font-mono text-xs text-[#D5FF00]">WORKSPACE 03 // CREATIVE</span>
                    <h2 className="font-display text-4xl text-[#F4F3ED] uppercase mt-1">Documentation & Defense Deck</h2>
                  </div>

                  <div className="card-dark p-8 sm:p-12 min-h-[420px] flex flex-col justify-between border-[#D5FF00]">
                    <div>
                      <span className="px-2.5 py-1 bg-[#1A1A1A] text-[#D5FF00] font-mono text-xs">
                        {presentationSlides[slideIdx].badge}
                      </span>
                      <h2 className="font-display text-5xl sm:text-6xl text-[#F4F3ED] uppercase mt-6 mb-2">
                        {presentationSlides[slideIdx].title}
                      </h2>
                      <p className="text-base text-[#D5FF00] font-grotesk mb-6">
                        {presentationSlides[slideIdx].subtitle}
                      </p>

                      {presentationSlides[slideIdx].team && (
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
                          {presentationSlides[slideIdx].team.map((tm, idx) => (
                            <div key={idx} className="p-4 bg-[#141414] border border-[#242424]">
                              <span className="font-bold text-sm text-[#F4F3ED] block">{tm.name}</span>
                              <span className="text-xs font-mono text-[#D5FF00] block mt-1">Roll: {tm.roll}</span>
                            </div>
                          ))}
                        </div>
                      )}

                      {presentationSlides[slideIdx].points && (
                        <ul className="space-y-2 mt-6 text-xs text-[#888888] list-disc list-inside">
                          {presentationSlides[slideIdx].points.map((p, idx) => (
                            <li key={idx}>{p}</li>
                          ))}
                        </ul>
                      )}
                    </div>

                    <div className="pt-6 mt-8 border-t border-[#222222] flex justify-between font-mono text-xs text-[#777777]">
                      <span>Evaluator Cue: {presentationSlides[slideIdx].notes}</span>
                      <div className="flex gap-2">
                        <button
                          disabled={slideIdx === 0}
                          onClick={() => setSlideIdx(prev => prev - 1)}
                          className="px-3 py-1 bg-[#1C1C1C] disabled:opacity-30 text-[#F4F3ED]"
                        >
                          Prev
                        </button>
                        <button
                          disabled={slideIdx === presentationSlides.length - 1}
                          onClick={() => setSlideIdx(prev => prev + 1)}
                          className="px-3 py-1 bg-[#1C1C1C] disabled:opacity-30 text-[#F4F3ED]"
                        >
                          Next
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}

          {/* Login Modal */}
          {showLogin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="card-dark max-w-md w-full p-8 space-y-6 relative border-[#D5FF00]">
                <button onClick={() => setShowLogin(false)} className="absolute top-6 right-6 text-[#777777] hover:text-[#F4F3ED]">✕</button>
                <div>
                  <span className="font-mono text-xs text-[#D5FF00] uppercase font-bold block mb-1">SECURE PORTAL</span>
                  <h3 className="font-display text-3xl uppercase text-[#F4F3ED]">Sign In to CodeFusion</h3>
                </div>
                <div className="space-y-3">
                  <button
                    onClick={() => handleLogin('GitHub')}
                    className="w-full py-3.5 bg-[#161616] hover:bg-[#1E1E1E] border border-[#2E2E2E] text-xs font-mono font-bold text-[#F4F3ED] flex items-center justify-center gap-2"
                  >
                    Continue with GitHub
                  </button>
                  <button
                    onClick={() => handleLogin('Google')}
                    className="w-full py-3.5 bg-[#161616] hover:bg-[#1E1E1E] border border-[#2E2E2E] text-xs font-mono font-bold text-[#F4F3ED] flex items-center justify-center gap-2"
                  >
                    Continue with Google
                  </button>
                  <button
                    onClick={() => handleLogin('Guest Developer')}
                    className="w-full py-3.5 neon-btn font-grotesk text-xs uppercase"
                  >
                    Launch Developer Guest Session ↗
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Synopsis Modal */}
          {showSynopsis && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="card-dark max-w-2xl w-full p-8 max-h-[85vh] overflow-y-auto space-y-6 border-[#2B2B2B]">
                <div className="flex justify-between items-center border-b border-[#222222] pb-4">
                  <h3 className="font-display text-2xl uppercase text-[#F4F3ED]">Project Synopsis Specification</h3>
                  <button onClick={() => setShowSynopsis(false)} className="text-[#777777] hover:text-[#F4F3ED]">✕</button>
                </div>
                <div>
                  <span className="font-mono text-xs text-[#D5FF00] uppercase block mb-2">Team Members (Year 2026)</span>
                  <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                    {projectMetadata.team.map((m, i) => (
                      <div key={i} className="p-3 bg-[#141414] border border-[#222222]">
                        <span className="font-bold text-[#F4F3ED] block">{m.name}</span>
                        <span className="text-[#D5FF00] block">Roll: {m.roll}</span>
                        <span className="text-[#666666] block">Enr: {m.enrollment}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <span className="font-mono text-xs text-[#D5FF00] uppercase block mb-1">Abstract</span>
                  <p className="text-xs text-[#888888] leading-relaxed">
                    CodeFusion is an intelligent software development platform designed for students, freelancers, startups, and professional teams. Modern development requires constant switching between tools such as VS Code, GitHub, Trello, Slack, and AI assistants, which fragments knowledge. CodeFusion provides a unified workspace where coding, documentation, collaboration, API testing, analytics, and AI-guided learning coexist.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* AI Copilot Drawer */}
          {showCopilot && (
            <div className="fixed bottom-4 right-4 z-50 max-w-md w-full card-dark p-5 border-[#D5FF00] space-y-4">
              <div className="flex justify-between items-center border-b border-[#222222] pb-2 font-mono text-xs">
                <span className="text-[#D5FF00]">AI PROJECT INTELLIGENCE ENGINE</span>
                <button onClick={() => setShowCopilot(false)} className="text-[#777777]">✕</button>
              </div>
              <p className="text-xs text-[#CCCCCC] leading-relaxed">
                Continuous codebase AST is 98.4% indexed in Supabase pgvector. All 3 workspaces active.
              </p>
              <div className="p-3 bg-[#0A0A0A] border-l-2 border-[#D5FF00] text-xs font-mono text-[#888888]">
                Ready to explain modules, generate READMEs, or suggest architecture improvements.
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
